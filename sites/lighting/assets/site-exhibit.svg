<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" fill="none">
  <title>Illustrative parking area fixture and calculation grid</title>
  <desc>Four fixtures sit in two parking rows across a common drive aisle. A boundary review line surrounds the layout.</desc>
  <defs>
    <pattern id="sheet-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" stroke="#2E322E" stroke-width="1"/></pattern>
    <pattern id="point-grid" x="70" y="121" width="30" height="27" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.65" fill="#D3C8AC"/></pattern>
    <radialGradient id="pool"><stop stop-color="#F7CB86" stop-opacity=".36"/><stop offset=".5" stop-color="#F7CB86" stop-opacity=".1"/><stop offset="1" stop-color="#F7CB86" stop-opacity="0"/></radialGradient>
    <g id="fixture"><path d="M0-8 8 0 0 8-8 0Z" fill="#22231F" stroke="#F7CB86" stroke-width="2"/><circle r="2.3" fill="#F7CB86"/></g>
  </defs>
  <path fill="#191C1C" d="M0 0h720v510H0z"/>
  <path fill="url(#sheet-grid)" d="M0 0h720v510H0z"/>
  <path d="M35 49H629V354H539V407H35V49Z" stroke="#DA946C" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="35" y="34" fill="#F1AB84" font-family="monospace" font-size="13" letter-spacing="1">BOUNDARY REVIEW LINE</text>
  <path d="M72 81H597V320H502V374H72V81Z" fill="#202321" stroke="#91948A" stroke-width="2"/>
  <path d="M95 111H574V174H95ZM95 251H484V344H95Z" fill="#292D29" stroke="#757970" stroke-width="1.2"/>
  <path d="M130 112v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44M130 300v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44m36-44v44" stroke="#73756A" stroke-width="1.2"/>
  <path d="M89 211H574M89 223H574" stroke="#6F756B" stroke-dasharray="12 9"/>
  <text x="448" y="243" fill="#BEBEB3" font-family="monospace" font-size="13" letter-spacing="1">DRIVE AISLE</text>
  <path d="M92 124H552V341H92V124Z" fill="url(#point-grid)"/>
  <ellipse cx="197" cy="166" rx="110" ry="87" fill="url(#pool)"/>
  <ellipse cx="394" cy="166" rx="110" ry="87" fill="url(#pool)"/>
  <ellipse cx="253" cy="268" rx="110" ry="87" fill="url(#pool)"/>
  <ellipse cx="444" cy="268" rx="110" ry="87" fill="url(#pool)"/>
  <g stroke="#d0a76b" opacity=".43">
    <ellipse cx="197" cy="166" rx="58" ry="39"/><ellipse cx="394" cy="166" rx="58" ry="39"/>
    <ellipse cx="253" cy="268" rx="58" ry="39"/><ellipse cx="444" cy="268" rx="58" ry="39"/>
  </g>
  <g stroke="#E6B777" opacity=".7">
    <ellipse cx="197" cy="166" rx="30" ry="22"/><ellipse cx="394" cy="166" rx="30" ry="22"/>
    <ellipse cx="253" cy="268" rx="30" ry="22"/><ellipse cx="444" cy="268" rx="30" ry="22"/>
  </g>
  <use href="#fixture" x="197" y="166"/><use href="#fixture" x="394" y="166"/><use href="#fixture" x="253" y="268"/><use href="#fixture" x="444" y="268"/>
  <path d="M550 374h78v33h-78z" fill="#252927" stroke="#84867A"/>
  <path d="M561 385h56m-56 10h56M575 374v33m14-33v33m14-33v33" stroke="#565B52"/>
  <path d="M36 430H683" stroke="#73756A"/>
  <text x="36" y="456" fill="#F7CB86" font-family="monospace" font-size="15" letter-spacing="1.3">FIXTURE LOCATIONS AND GRID</text>
  <text x="36" y="481" fill="#D6CDBF" font-family="monospace" font-size="13" letter-spacing=".5">SCHEMATIC VIEW · NO CALCULATED VALUES</text>
  <path d="M655 125V83m0 0-7 11m7-11 7 11" stroke="#E7E1D5" stroke-width="1.7"/>
  <text x="651" y="76" fill="#E7E1D5" font-family="monospace" font-size="13">N</text>
