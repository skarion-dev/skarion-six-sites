<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Fictional CCTV record reconciliation</title>
  <desc id="desc">Seven synthetic inspection records enter a review queue. The three example rows identify an exact owner match, an alias candidate and an orphaned record.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#86a99a" stroke-opacity=".16"/></pattern>
  </defs>
  <rect width="960" height="620" fill="#122925"/>
  <rect width="960" height="620" fill="url(#grid)"/>
  <path d="M37 44h886v532H37z" fill="#17352f" stroke="#53756b"/>
  <g font-family="system-ui, sans-serif">
    <text x="63" y="78" font-size="14" fill="#b5d4c7" letter-spacing="2.4">FICTIONAL HANDOFF EXTRACT</text>
    <text x="63" y="123" font-size="38" font-weight="650" fill="#f4f7ea" letter-spacing="-1.6">Inspection relationship queue</text>
    <path d="M63 147h833" stroke="#53756b"/>
    <rect x="63" y="168" width="240" height="71" rx="5" fill="#1d4138" stroke="#53756b"/>
    <rect x="319" y="168" width="240" height="71" rx="5" fill="#1d4138" stroke="#53756b"/>
    <rect x="575" y="168" width="321" height="71" rx="5" fill="#1d4138" stroke="#53756b"/>
    <g font-size="29" font-weight="700">
      <text x="82" y="213" fill="#f4f7ea">7</text><text x="338" y="213" fill="#a4e2c9">3</text><text x="594" y="213" fill="#f6c785">4</text>
    </g>
    <g font-size="16" fill="#e1eae1">
      <text x="110" y="210">input records</text><text x="366" y="210">exact links</text><text x="622" y="210">other dispositions</text>
    </g>
    <path d="M63 263h833v247H63z" fill="#122b25" stroke="#53756b"/>
    <path d="M63 263h833v45H63z" fill="#24483e"/>
    <g font-size="15" font-weight="650" fill="#cce0d8">
      <text x="84" y="291">Inspection record</text><text x="279" y="291">Raw asset ID</text><text x="466" y="291">Candidate ID</text><text x="649" y="291">Disposition</text>
    </g>
    <g stroke="#3f6258">
      <path d="M63 375h833M63 442h833M254 263v247m186-247v247m185-247v247"/>
    </g>
    <g fill="#f4f7ea" font-size="20" font-weight="600">
      <text x="84" y="349">CCTV-11</text><text x="279" y="349">P-107</text><text x="466" y="349">P-107</text>
      <text x="84" y="416">CCTV-21</text><text x="279" y="416">P209A</text><text x="466" y="416">P-209</text>
      <text x="84" y="483">CCTV-22</text><text x="279" y="483">P-702</text><text x="466" y="483">—</text>
    </g>
    <g>
      <rect x="647" y="327" width="146" height="31" rx="3" fill="#244e43"/>
      <rect x="647" y="394" width="147" height="31" rx="3" fill="#54442a"/>
      <rect x="647" y="461" width="155" height="31" rx="3" fill="#54442a"/>
      <g font-size="15" font-weight="700"><text x="660" y="348" fill="#b4ead4">Exact owner ID</text><text x="660" y="415" fill="#f8d6a0">Alias in review</text><text x="660" y="482" fill="#f8d6a0">No registry match</text></g>
    </g>
    <text x="63" y="548" fill="#b5d4c7" font-size="15">Review extract · Three illustrative rows from the seven-record sample</text>
  </g>
</svg>
